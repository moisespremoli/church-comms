<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b12" />
    <title>Sem ligação · Church Comms</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #070b12; color: #eef2f8;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 26rem; padding: 1.5rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { color: #a9b4c6; line-height: 1.5; }
      button {
        margin-top: 1.25rem; min-height: 3.5rem; width: 100%; border: 0; border-radius: 0.9rem;
        background: #38bdf8; color: #070b12; font-size: 1rem; font-weight: 700; cursor: pointer;
      }
      .note { font-size: 0.85rem; color: #75829a; margin-top: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" aria-hidden="true">
        <path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M5 12.86a10 10 0 0 1 5.17-2.69M19 12.86a10 10 0 0 0-2.01-1.36M2 8.82a15 15 0 0 1 4.18-2.65M22 8.82a15 15 0 0 0-11.29-3.76M2 2l20 20"/>
      </svg>
      <h1>Sem ligação</h1>
      <p>O Church Comms precisa de internet para enviar e receber mensagens. Assim que a ligação voltar, as conversas são sincronizadas.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
      <p class="note">Em caso de emergência, use os meios oficiais (112) e os procedimentos da igreja.</p>
    </main>
  </body>
